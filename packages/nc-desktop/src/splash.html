<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NocoDB Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-app-region: drag;
    }
    .container {
      max-width: 440px;
      width: 100%;
      text-align: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 36px 28px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      -webkit-app-region: no-drag;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #3366ff 0%, #1e40af 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(51, 102, 255, 0.35);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtext {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: #58a6ff;
      margin-bottom: 20px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(88, 166, 255, 0.2);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .mcp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(35, 134, 54, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);
      color: #3fb950;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    button {
      background: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #2ea043;
    }
    .footer-note {
      font-size: 11px;
      color: #484f58;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">N</div>
    <h1>NocoDB Desktop</h1>
    <p class="subtext">Connecting to your NocoDB database engine...</p>

    <div class="mcp-pill">
      <span>●</span> M3ta-Os REA MCP Ready
    </div>

    <div class="status-row" id="statusRow">
      <div class="spinner"></div>
      <span id="statusText">Starting services on localhost:8080...</span>
    </div>

    <div class="input-group">
      <input type="text" id="serverInput" value="http://localhost:8080" placeholder="http://localhost:8080">
      <button id="connectBtn">Connect</button>
    </div>

    <p class="footer-note">Press <kbd>Cmd+M</kbd> anytime to inspect M3ta-Os MCP configuration.</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const target = urlParams.get('target');
    if (target) {
      document.getElementById('serverInput').value = target;
      document.getElementById('statusText').innerText = `Connecting to ${target}...`;
    }

    if (window.nocoDesktop) {
      window.nocoDesktop.onServerStatus((status) => {
        const statusText = document.getElementById('statusText');
        const spinner = document.querySelector('.spinner');
        if (!status.connected) {
          if (spinner) spinner.style.display = 'none';
          statusText.style.color = '#f85149';
          statusText.innerText = status.message || 'Connection failed.';
        }
      });
    }

    document.getElementById('connectBtn').addEventListener('click', () => {
      const url = document.getElementById('serverInput').value.trim();
      if (url && window.nocoDesktop) {
        document.getElementById('statusText').style.color = '#58a6ff';
        document.getElementById('statusText').innerText = `Connecting to ${url}...`;
        const spinner = document.querySelector('.spinner');
        if (spinner) spinner.style.display = 'block';
        window.nocoDesktop.reconnectServer(url);
      }
    });
  </script>
</body>
</html>
